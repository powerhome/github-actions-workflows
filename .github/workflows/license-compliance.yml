on:
  workflow_call:
    secrets:
      npm_token:
        required: false
    inputs:
      arguments:
        required: false
        type: string
      workdir:
        required: false
        type: string
      gemfiles:
        description: JSON list of the gemfiles to install. When not given, the Gemfile is installed and cached by ruby/setup-ruby
        required: false
        type: string
      decisions:
        required: false
        type: string
        default: doc/dependency_decisions.yml

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Enable npm.powerapp.cloud auth
        shell: bash
        env:
          NPM_REGISTRY_PASSWORD: ${{ secrets.npm_token }}
        run: |
          if [ -z "$NPM_REGISTRY_PASSWORD" ]; then
            exit 0
          fi

          auth="$(printf 'gh-actions:%s' "$NPM_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          {
            echo "registry=https://npm.powerapp.cloud"
            echo "//npm.powerapp.cloud/:_auth=${auth}"
            echo "//npm.powerapp.cloud/:always-auth=true"
          } >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4.11
          bundler-cache: ${{ inputs.gemfiles == '' }}
          working-directory: ${{ inputs.workdir }}
      - name: Install gems
        if: ${{ inputs.gemfiles != '' }}
        working-directory: ${{ inputs.workdir }}
        env:
          GEMFILES: ${{ toJSON(fromJSON(inputs.gemfiles || '[]')) }}
        run: |
          mapfile -t gemfiles < <(jq -r '.[]' <<< "$GEMFILES")
          for gemfile in "${gemfiles[@]}"; do
            BUNDLE_GEMFILE="$gemfile" bundle install --jobs 4
          done
      - run: gem install license_patrol
      - name: Ensure license compliance with ${{ inputs.workdir }}/${{ inputs.decisions }}
        working-directory: ${{ inputs.workdir }}
        run: "license_patrol --decisions-file=${{ inputs.decisions }} ${{ inputs.arguments }}"
