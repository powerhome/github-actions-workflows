on:
  workflow_call:
    secrets:
      secrets.rubygems_api_key:
        required: false
    inputs:
      before_build:
        type: string
        required: false
      package:
        required: true
        type: string
      release-tag:
        required: false
        default: true
        type: boolean
      workdir:
        required: false
        type: string
      ruby:
        default: '["2.7","3.0","3.1","3.2"]'
        required: false
        type: string
      gemfiles:
        default: '["Gemfile"]'
        required: false
        type: string
      bundler:
        default: '["2"]'
        required: false
        type: string
      exclude:
        default: "[]"
        required: false
        type: string
      license-decisions:
        required: false
        type: string
        default: doc/dependency_decisions.yml
      license-arguments:
        required: false
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} / Bundler ${{ matrix.bundler }} / ${{ matrix.gemfile }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ${{ fromJSON(inputs.ruby) }}
        gemfile: ${{ fromJSON(inputs.gemfiles) }}
        bundler: ${{ fromJSON(inputs.bundler) }}
        exclude: ${{ fromJSON(inputs.exclude)}}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Before build
        if: ${{ inputs.before_build != '' }}
        run: "${{ inputs.before_build }}"
      # These are the steps of ./build-ruby-gem. A reusable workflow can't call
      # an action from its own repository by relative path, and calling it by
      # SHA would need a commit to contain its own SHA.
      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
          BUNDLER_VERSION: ${{ matrix.bundler }}
          RAILS_ENV: test
        with:
          bundler-cache: true
          bundler: ${{ matrix.bundler }}
          ruby-version: ${{ matrix.ruby }}
          working-directory: ${{ inputs.workdir }}
      - name: Run the build script
        env:
          BUNDLE_GEMFILE: ${{ matrix.gemfile }}
          BUNDLER_VERSION: ${{ matrix.bundler }}
          RAILS_ENV: test
        working-directory: ${{ inputs.workdir }}
        shell: bash
        run: bundle exec rake

  license-compliance:
    uses: ./.github/workflows/license-compliance.yml
    with:
      workdir: "${{ inputs.workdir }}"
      ruby: "${{ fromJSON(inputs.ruby)[0] }}"
      gemfiles: "${{ inputs.gemfiles }}"
      decisions: "${{ inputs.license-decisions }}"
      arguments: "${{ inputs.license-arguments }} --bundler_gemfiles ${{ join(fromJSON(inputs.gemfiles), ' ') }}"

  all:
    if: ${{ always() }}
    runs-on: ubuntu-latest
    name: All
    needs: [build, license-compliance]
    steps:
      - run: |
          result="${{ needs.build.result }}"
          if [[ $result == "success" || $result == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi

  release:
    needs: [build, license-compliance]
    runs-on: ubuntu-latest
    if: ${{ contains(github.ref, 'refs/tags/v') && (contains(github.ref, inputs.package) || !inputs.release-tag) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cadwallion/publish-rubygems-action@94a6f4cd5350581749c569b5001eecc864e3ad0b # v1.1.0
        env:
          RELEASE_COMMAND: rake build release:guard_clean release:rubygem_push
          RUBYGEMS_API_KEY: ${{ secrets.rubygems_api_key }}
          WORKDIR: ${{ inputs.workdir }}
