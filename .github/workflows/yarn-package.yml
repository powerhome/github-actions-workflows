on:
  workflow_call:
    secrets:
      npm_token:
        required: true
    inputs:
      node:
        default: '["22"]'
        required: false
        type: string
      release-tag:
        required: false
        default: true
        type: boolean
      workdir:
        required: false
        type: string
      package:
        required: true
        type: string
      license-decisions:
        required: false
        type: string
        default: doc/dependency_decisions.yml

env:
  # Exact patch so publishing never falls back to an older cached Node.
  # 22.23.4 is the first Node 22 release that distrusts the compromised eMudhra CAs.
  NODE_RELEASE_VERSION: "22.23.4"
  REGISTRY_URL: "https://registry.npmjs.org"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(inputs.node) }}
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          check-latest: true
      - name: Require a Node release that distrusts the compromised eMudhra CAs
        shell: bash
        run: |
          node -e '
            const minimums = { 22: "22.23.4", 24: "24.22.1", 26: "26.12.1" };
            const current = process.versions.node;
            const minimum = minimums[current.split(".")[0]];
            const older = (a, b) => {
              const [x, y] = [a, b].map((v) => v.split(".").map(Number));
              for (let i = 0; i < 3; i++) if (x[i] !== y[i]) return x[i] < y[i];
              return false;
            };
            if (!minimum || older(current, minimum)) {
              console.log(`::error::Node ${current} still trusts the compromised eMudhra CAs. Use Node ${Object.values(minimums).join(", ")} or newer in the same line.`);
              process.exit(1);
            }
          '
      - name: Enable npm.powerapp.cloud auth
        shell: bash
        env:
          NPM_REGISTRY_PASSWORD: ${{ secrets.npm_token }}
        run: |
          auth="$(printf 'gh-actions:%s' "$NPM_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          {
            echo "registry=https://npm.powerapp.cloud"
            echo "//npm.powerapp.cloud/:_auth=${auth}"
            echo "//npm.powerapp.cloud/:always-auth=true"
          } >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
      - run: yarn install --frozen-lockfile
        working-directory: ${{ inputs.workdir }}
      - run: yarn lint
        working-directory: ${{ inputs.workdir }}
      - run: yarn build
        working-directory: ${{ inputs.workdir }}
      - run: yarn test
        working-directory: ${{ inputs.workdir }}

  license-compliance:
    uses: ./.github/workflows/license-compliance.yml
    with:
      workdir: "${{ inputs.workdir }}"
      decisions: "${{ inputs.license-decisions }}"
    secrets:
      npm_token: ${{ secrets.npm_token }}

  release:
    needs: [build, license-compliance]
    runs-on: ubuntu-latest
    name: Release
    if: ${{ contains(github.ref, 'refs/tags/v') && (contains(github.ref, inputs.package) || !inputs.release-tag) }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node ${{ env.NODE_RELEASE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_RELEASE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}
      - run: yarn install --frozen-lockfile
        working-directory: ${{ inputs.workdir }}
      - run: yarn build
        working-directory: ${{ inputs.workdir }}
      - run: yarn publish
        working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
