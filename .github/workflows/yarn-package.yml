on:
  workflow_call:
    secrets:
      npm_token:
        required: true
    inputs:
      node:
        default: '["18", "16"]'
        required: false
        type: string
      workdir:
        required: false
        type: string
      package:
        required: true
        type: string
      license-decisions:
        required: false
        type: string
        default: doc/dependency_decisions.yml

env:
  NODE_RELEASE_VERSION: "20"
  REGISTRY_URL: "https://registry.npmjs.org"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(inputs.node) }}
    name: Node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Enable npm.powerapp.cloud auth
        shell: bash
        env:
          NPM_REGISTRY_PASSWORD: ${{ secrets.npm_token }}
        run: |
          auth="$(printf 'gh-actions:%s' "$NPM_REGISTRY_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          {
            echo "registry=https://npm.powerapp.cloud"
            echo "//npm.powerapp.cloud/:_auth=${auth}"
            echo "//npm.powerapp.cloud/:always-auth=true"
          } >> "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
      - run: yarn install --frozen-lockfile
        working-directory: ${{ inputs.workdir }}
      - run: yarn lint
        working-directory: ${{ inputs.workdir }}
      - run: yarn build
        working-directory: ${{ inputs.workdir }}
      - run: yarn test
        working-directory: ${{ inputs.workdir }}

  license-compliance:
    uses: ./.github/workflows/license-compliance.yml
    with:
      workdir: "${{ inputs.workdir }}"
      decisions: "${{ inputs.license-decisions }}"
    secrets:
      npm_token: ${{ secrets.npm_token }}

  release:
    needs: [build, license-compliance]
    runs-on: ubuntu-latest
    name: Release
    if: ${{ contains(github.ref, 'refs/tags/v') && contains(github.ref, inputs.package) }}
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node ${{ env.NODE_RELEASE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_RELEASE_VERSION }}
          registry-url: ${{ env.REGISTRY_URL }}
      - run: yarn install --frozen-lockfile
        working-directory: ${{ inputs.workdir }}
      - run: yarn build
        working-directory: ${{ inputs.workdir }}
      - run: yarn publish
        working-directory: ${{ inputs.workdir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token }}
