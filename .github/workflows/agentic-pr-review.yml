name: Agentic PR Review

# Runs automatically on:
#  - PR opened (including drafts)
#  - PR marked ready for review (draft -> ready)
#  - `agentic-review` label (re-)applied for a manual rerun
#  - New commits pushed to a PR that carries the `agentic-review` label (reviews only
#    the commits since the last review)
#  - PR comment containing @nitro-pr-review from a powerhome org member
#
# Never runs when the PR carries the `agentic-review-opt-out` label. This repository is
# public, so PRs from forks and comments from outside the org never run it.
on:
  pull_request:
    types: [opened, ready_for_review, labeled, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  agentic-review:
    name: PR Review
    if: |
      !contains(github.event.pull_request.labels.*.name, 'agentic-review-opt-out') &&
      !contains(github.event.issue.labels.*.name, 'agentic-review-opt-out') &&
      (
        (
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository && (
            github.event.action == 'opened' ||
            github.event.action == 'ready_for_review' ||
            (github.event.action == 'labeled' && github.event.label.name == 'agentic-review') ||
            (github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'agentic-review'))
          )
        ) ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          contains(github.event.comment.body, '@nitro-pr-review') &&
          contains(fromJSON('["OWNER","MEMBER"]'), github.event.comment.author_association)
        )
      )
    runs-on: ubuntu-latest
    steps:
      # A comment event carries no head repository, so the fork check runs against the PR.
      - name: Check eligibility
        id: eligibility
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail

          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '"\(.state) \(.head.repo.full_name)"')"
          if [[ "${pr}" != "open ${GITHUB_REPOSITORY}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "Skipping agentic review because the PR is not open or comes from a fork"
          fi

      - name: Review PR with Cursor
        timeout-minutes: 15
        if: steps.eligibility.outputs.skip != 'true'
        uses: powerhome/github-actions-workflows/agentic-pr-review@874e39c4e1004e505f81a8cb48e338dae09d936f # main
        with:
          app-id: ${{ secrets.AGENTIC_REVIEW_GITHUB_APP_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_GITHUB_APP_PRIVATE_KEY }}
          provider: cursor
          provider-api-key: ${{ secrets.AGENTIC_REVIEW_PROVIDER_API_KEY }}
          pull-request-number: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Pass the full comment through so org members can steer a rerun.
          additional-prompt: ${{ github.event_name == 'issue_comment' && github.event.comment.body || '' }}
