name: Agentic PR review
description: Run a headless agent on the PR diff and post a comment-only GitHub review

inputs:
  app-id:
    description: GitHub App ID used to create an installation token
    required: true
  private-key:
    description: GitHub App private key (PEM)
    required: true
  provider:
    description: Review backend (supported values — cursor, claude)
    required: false
    default: cursor
  provider-api-key:
    description: API credential for the selected provider (Cursor maps this to CURSOR_API_KEY, Claude to ANTHROPIC_API_KEY)
    required: true
  pull-request-number:
    description: Pull request number to review
    required: true
  deepen-length:
    description: Passed to rmacklin/fetch-through-merge-base as deepen_length
    required: false
    default: "30"
  model:
    description: Model to use for the review (passed to the provider CLI)
    required: false
    default: ""
  claude-settings:
    description: Claude Code settings that replace the bundled read-only shared/config/claude-settings.json, as a file path relative to the workspace or a JSON string (claude provider only)
    required: false
    default: ""
  claude-args:
    description: Extra arguments for the claude CLI, parsed with shell quoting, e.g. --allowed-tools "Bash(gh pr view:*)" (claude provider only)
    required: false
    default: ""
  additional-prompt:
    description: Extra instructions appended to the review prompt (e.g. full text of an @nitro-pr-review PR comment)
    required: false
    default: ""
  review-scope:
    description: auto reviews only the commits pushed since the bot's last review, and the whole PR on its first review, after a rebase or force-push, or when triggered by issue_comment or workflow_dispatch; full always reviews the whole PR
    required: false
    default: auto

runs:
  using: composite
  steps:
    - name: Create GitHub App token
      id: app_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        # client-id, not the deprecated app-id: the action resolves both to one value and
        # hands it to Octokit as the JWT issuer, so the existing App ID secret still works.
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Post in-progress status comment
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        COMMENT_MODE: upsert
        COMMENT_TAG: agentic-pr-review-status
        COMMENT_BODY: |
          :hourglass_flowing_sand: **Agentic PR Review** — in progress

          [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})
      run: ruby "${{ github.action_path }}/../shared/bin/comment.rb"

    - name: Fetch PR metadata
      id: pr_gate
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
      run: |
        set -euo pipefail

        gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
          > pr.json

        {
          echo "base_sha=$(jq -r '.base.sha' pr.json)"
          echo "head_sha=$(jq -r '.head.sha' pr.json)"
        } >> "${GITHUB_OUTPUT}"

    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ steps.pr_gate.outputs.head_sha }}
        fetch-depth: 1
        token: ${{ steps.app_token.outputs.token }}

    - name: Fetch base commit (for merge-base)
      shell: bash
      env:
        BASE_SHA: ${{ steps.pr_gate.outputs.base_sha }}
      run: git fetch --depth=1 origin "$BASE_SHA"

    - name: Fetch through merge-base
      uses: rmacklin/fetch-through-merge-base@bfe4d03a86f9afa52bc1a70e9814fc92a07f7b75 # v0
      with:
        base_ref: ${{ steps.pr_gate.outputs.base_sha }}
        head_ref: ${{ steps.pr_gate.outputs.head_sha }}
        deepen_length: ${{ inputs.deepen-length }}

    # Before the credential goes: a last-reviewed commit outside the fetched history is
    # fetched by SHA to tell a merge from the base branch apart from a rewritten branch.
    - name: Plan review scope
      id: scope
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        PULL_NUMBER: ${{ inputs.pull-request-number }}
        HEAD_SHA: ${{ steps.pr_gate.outputs.head_sha }}
        APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        REVIEW_SCOPE: ${{ inputs.review-scope }}
        EVENT_NAME: ${{ github.event_name }}
        REVIEW_CONTEXT_PATH: ${{ runner.temp }}/agentic-pr-review-context.json
      run: ruby "${{ github.action_path }}/scripts/plan_review.rb"

    - name: Remove Git credentials from the workspace
      shell: bash
      # actions/checkout persists the installation token in .git/config, and the provider
      # then reads this workspace while that token is still valid -- so prompt-influenced
      # output could read it and post it in the review. Every remaining Git operation is
      # local, so the credential is dropped here rather than left for the provider to find.
      run: |
        set -euo pipefail

        git -C "${GITHUB_WORKSPACE}" config --local --unset-all \
          "http.https://github.com/.extraheader" || true

        if git -C "${GITHUB_WORKSPACE}" config --local --get-regexp "^http\..*\.extraheader$" >/dev/null 2>&1; then
          echo "An authorization header is still present in .git/config" >&2
          exit 1
        fi

    - name: Compute PR diff
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        BASE_SHA: ${{ steps.pr_gate.outputs.base_sha }}
        HEAD_SHA: ${{ steps.pr_gate.outputs.head_sha }}
        REVIEW_MODE: ${{ steps.scope.outputs.mode }}
        LAST_REVIEWED_SHA: ${{ steps.scope.outputs.last_reviewed_sha }}
        PR_DIFF_PATH: ${{ github.workspace }}/pr.diff
        PR_INCREMENTAL_DIFF_PATH: ${{ github.workspace }}/pr-incremental.diff
      # The workspace is the pull-request head, so it may already hold a symlink named
      # pr.diff or pr-incremental.diff, and a redirect follows one. rm -rf unlinks it instead.
      run: |
        set -euo pipefail
        rm -rf -- "${PR_DIFF_PATH}" "${PR_INCREMENTAL_DIFF_PATH}"
        git diff "${BASE_SHA}...${HEAD_SHA}" > "${PR_DIFF_PATH}"
        if [[ "${REVIEW_MODE}" == "incremental" ]]; then
          git diff "${LAST_REVIEWED_SHA}" "${HEAD_SHA}" > "${PR_INCREMENTAL_DIFF_PATH}"
        fi

    # AGENTS.md, CLAUDE.md, .cursor/ and .claude/ are read by the CLI as instructions, so a
    # pull request editing them could tell its own reviewer what to say. The edits are still
    # in pr.diff, where they get reviewed like any other change.
    - name: Reset agent instructions to the merge base
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        BASE_SHA: ${{ steps.pr_gate.outputs.base_sha }}
        HEAD_SHA: ${{ steps.pr_gate.outputs.head_sha }}
      run: ruby "${{ github.action_path }}/../shared/bin/trusted_agent_instructions.rb"

    # Written outside the workspace, which the pull request controls and the provider reads.
    - name: Compose review prompt
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        REVIEW_PROMPT_PATH: ${{ github.action_path }}/prompts/review.md
        REVIEW_ADDITIONAL_INSTRUCTIONS: ${{ inputs.additional-prompt }}
        REVIEW_CONTEXT_PATH: ${{ runner.temp }}/agentic-pr-review-context.json
        AGENT_PROMPT_PATH: ${{ runner.temp }}/agentic-pr-review-prompt.md
      run: ruby "${{ github.action_path }}/scripts/compose_prompt.rb"

    - name: Run review provider
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        PROVIDER_API_KEY: ${{ inputs.provider-api-key }}
        MODEL: ${{ inputs.model }}
        CLAUDE_SETTINGS: ${{ inputs.claude-settings }}
        CLAUDE_ARGS: ${{ inputs.claude-args }}
        AGENT_PROMPT_PATH: ${{ runner.temp }}/agentic-pr-review-prompt.md
        AGENT_OUTPUT_PATH: ${{ github.workspace }}/review-agent.json
      run: bash "${{ github.action_path }}/../shared/bin/run_provider.sh"

    - name: Upload agent review JSON
      if: steps.scope.outputs.mode != 'skip'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: agentic-pr-review-json
        path: ${{ github.workspace }}/review-agent.json
        if-no-files-found: warn

    - name: Post review to GitHub
      if: steps.scope.outputs.mode != 'skip'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        PULL_NUMBER: ${{ inputs.pull-request-number }}
        COMMIT_SHA: ${{ steps.pr_gate.outputs.head_sha }}
        REVIEW_JSON_PATH: ${{ github.workspace }}/review-agent.json
        REVIEW_CONTEXT_PATH: ${{ runner.temp }}/agentic-pr-review-context.json
        PR_DIFF_PATH: ${{ github.workspace }}/pr.diff
        PR_INCREMENTAL_DIFF_PATH: ${{ github.workspace }}/pr-incremental.diff
      run: ruby "${{ github.action_path }}/scripts/post_review.rb"

    # create, not upsert: this comment carries no tag, so a second failure adds a second
    # comment. That is what the action this replaced did without one.
    - name: Post failure comment
      if: failure()
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        COMMENT_MODE: create
        COMMENT_BODY: |
          :x: **Agentic PR Review** — failed

          [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}) for details. If this looks like a transient error, re-run the job. For persistent failures, reach out in [Nitro Dev Discuss](https://nitro.powerhrg.com/connect/#rooms/138).
      run: ruby "${{ github.action_path }}/../shared/bin/comment.rb"

    # thollander's delete-on-completion ran in a post step, which a composite action does
    # not have. always() covers a failed or cancelled job, but a runner that dies outright
    # now leaves this comment behind.
    - name: Clear in-progress status comment
      if: always()
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        COMMENT_MODE: delete
        COMMENT_TAG: agentic-pr-review-status
      run: ruby "${{ github.action_path }}/../shared/bin/comment.rb"
