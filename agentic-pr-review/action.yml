name: Agentic PR review
description: Run a headless agent on the PR diff and post a comment-only GitHub review

inputs:
  app-id:
    description: GitHub App ID used to create an installation token
    required: true
  private-key:
    description: GitHub App private key (PEM)
    required: true
  provider:
    description: Review backend (supported values — cursor, nip)
    required: false
    default: cursor
  provider-api-key:
    description: API credential for the selected provider (Cursor maps this to CURSOR_API_KEY; NIP takes an inference gateway key)
    required: true
  pull-request-number:
    description: Pull request number to review
    required: true
  deepen-length:
    description: Commits to deepen the shallow clone by on each fetch while looking for the merge-base
    required: false
    default: "30"
  model:
    description: Model to use for the review (passed to the provider CLI)
    required: false
    default: ""
  additional-prompt:
    description: Extra instructions appended to the review prompt (e.g. full text of an @nitro-pr-review PR comment)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Create GitHub App token
      id: app_token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        # client-id, not the deprecated app-id: the action resolves both to one value and
        # hands it to Octokit as the JWT issuer, so the existing App ID secret still works.
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}

    - name: Post in-progress status comment
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        COMMENT_MODE: upsert
        COMMENT_TAG: agentic-pr-review-status
        COMMENT_BODY: |
          :hourglass_flowing_sand: **Agentic PR Review** — in progress

          [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }})
      run: ruby "${GITHUB_ACTION_PATH}/scripts/post_comment.rb"

    - name: Fetch PR metadata
      id: pr_gate
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
      run: |
        set -euo pipefail

        gh api \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2026-03-10" \
          "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
          > pr.json

        {
          echo "base_sha=$(jq -r '.base.sha' pr.json)"
          echo "head_sha=$(jq -r '.head.sha' pr.json)"
        } >> "${GITHUB_OUTPUT}"

    - name: Check out repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        ref: ${{ steps.pr_gate.outputs.head_sha }}
        fetch-depth: 1
        token: ${{ steps.app_token.outputs.token }}

    # In a job that runs in a container, the checkout is owned by the runner's user while the
    # steps run as root, and actions/checkout trusts it only for its own git calls (under a
    # temporary HOME), so git refuses the later fetch and diff steps as dubious ownership.
    # Trust the workspace globally, as checkout's set-safe-directory does on a plain runner.
    - name: Fetch base commit (for merge-base)
      shell: bash
      env:
        BASE_SHA: ${{ steps.pr_gate.outputs.base_sha }}
      run: |
        set -euo pipefail
        git config --global --get-all safe.directory | grep -qxF "${GITHUB_WORKSPACE}" ||
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
        git fetch --depth=1 origin "$BASE_SHA"

    # Inlined from rmacklin/fetch-through-merge-base, which runs its script through
    # github.action_path and so cannot find it in a container job. Unlike that script, this
    # stops once the history is no longer shallow instead of deepening forever.
    - name: Fetch through merge-base
      shell: bash
      env:
        BASE_SHA: ${{ steps.pr_gate.outputs.base_sha }}
        HEAD_SHA: ${{ steps.pr_gate.outputs.head_sha }}
        DEEPEN_LENGTH: ${{ inputs.deepen-length }}
      run: |
        set -euo pipefail
        until git merge-base "$BASE_SHA" "$HEAD_SHA" >/dev/null; do
          if [[ ! -f "$(git rev-parse --git-dir)/shallow" ]]; then
            echo "No merge-base between ${BASE_SHA} and ${HEAD_SHA}, even with full history" >&2
            exit 1
          fi
          git fetch -q --deepen="${DEEPEN_LENGTH}" origin "$BASE_SHA" "$HEAD_SHA"
        done

    - name: Compute PR diff
      shell: bash
      env:
        BASE_SHA: ${{ steps.pr_gate.outputs.base_sha }}
        HEAD_SHA: ${{ steps.pr_gate.outputs.head_sha }}
      run: |
        set -euo pipefail
        git diff "${BASE_SHA}...${HEAD_SHA}" > "${GITHUB_WORKSPACE}/pr.diff"

    - name: Run review provider
      shell: bash
      env:
        PROVIDER: ${{ inputs.provider }}
        PROVIDER_API_KEY: ${{ inputs.provider-api-key }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        MODEL: ${{ inputs.model }}
        REVIEW_ADDITIONAL_INSTRUCTIONS: ${{ inputs.additional-prompt }}
      # Paths come from GITHUB_ACTION_PATH and GITHUB_WORKSPACE rather than the github.action_path
      # and github.workspace expressions throughout: in a job that runs in a container, the
      # expressions expand to the runner host's paths, which the container mounts elsewhere.
      run: |
        set -euo pipefail

        export REVIEW_JSON_PATH="${GITHUB_WORKSPACE}/review-agent.json"
        export REVIEW_PROMPT_PATH="${GITHUB_ACTION_PATH}/prompts/review.md"

        provider="${PROVIDER:-cursor}"
        provider_script="${GITHUB_ACTION_PATH}/scripts/providers/${provider}.sh"

        if [[ ! -f "${provider_script}" ]]; then
          echo "Unknown provider: ${provider} (expected script at ${provider_script})" >&2
          exit 1
        fi

        exec bash "${provider_script}"

    - name: Upload agent review JSON
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: agentic-pr-review-json
        # Relative to the workspace, for the same reason as above.
        path: review-agent.json
        if-no-files-found: warn

    - name: Post review to GitHub
      shell: bash
      env:
        GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        PULL_NUMBER: ${{ inputs.pull-request-number }}
        COMMIT_SHA: ${{ steps.pr_gate.outputs.head_sha }}
      run: REVIEW_JSON_PATH="${GITHUB_WORKSPACE}/review-agent.json" ruby "${GITHUB_ACTION_PATH}/scripts/post_review.rb"

    # create, not upsert: this comment carries no tag, so a second failure adds a second
    # comment. That is what the action this replaced did without one.
    - name: Post failure comment
      if: failure()
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        COMMENT_MODE: create
        COMMENT_BODY: |
          :x: **Agentic PR Review** — failed

          [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}) for details. If this looks like a transient error, re-run the job. For persistent failures, reach out in [Nitro Dev Discuss](https://nitro.powerhrg.com/connect/#rooms/138).
      run: ruby "${GITHUB_ACTION_PATH}/scripts/post_comment.rb"

    # thollander's delete-on-completion ran in a post step, which a composite action does
    # not have. always() covers a failed or cancelled job, but a runner that dies outright
    # now leaves this comment behind.
    - name: Clear in-progress status comment
      if: always()
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app_token.outputs.token }}
        PR_NUMBER: ${{ inputs.pull-request-number }}
        COMMENT_MODE: delete
        COMMENT_TAG: agentic-pr-review-status
      run: ruby "${GITHUB_ACTION_PATH}/scripts/post_comment.rb"
